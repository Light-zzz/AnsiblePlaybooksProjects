---
- name: Deploy static website with Nginx
  hosts: slave1
  become: true # Run tasks with root privileges

  tasks:
    - name: Update yum cache
      yum:
        update_cache: yes

    - name: Install Nginx
      yum:
        name: nginx
        state: present

    - name: Ensure Nginx is running and enabled
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Install Git
      yum:
        name: git
        state: present

    - name: Clone the Git repository
      git:
        repo: https://github.com/Light-zzz/AWScodeBuild.git # Replace with your repo URL
        dest: /tmp/AWScodeBuild # Temporary location to clone the repo
        version: main # Or the branch you want to deploy

    - name: Copy index.html to Nginx web root
      copy:
        src: /tmp/AWScodeBuild/index.html # Path to index.html within the cloned repo
        dest: /usr/share/nginx/html/index.html
        remote_src: yes # Source is on the remote machine

    - name: Remove temporary repository
      file:
        path: /tmp/AWScodeBuild
        state: absent

    - name: Restart Nginx to apply changes
      systemd:
        name: nginx
        state: restarted
