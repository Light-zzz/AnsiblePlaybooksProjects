---
- name: Install Jenkins on Ubuntu (slaveVM3) and print public IP
  hosts: slaveVM3
  become: yes
  tasks:

    - name: Remove any old Jenkins repository entries
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/jenkins.list
        state: absent

    - name: Clean old Jenkins GPG keys (if any)
      ansible.builtin.shell: apt-key del 5BA31D57EF5975CA || true

    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install dependencies for Jenkins
      apt:
        name:
          - openjdk-17-jdk
          - curl
          - gnupg
        state: present

    - name: Add Jenkins repository key (2023 version)
      ansible.builtin.shell: |
        curl -fsSL https://pkg.jenkins.io/debian/jenkins.io-2023.key | sudo tee /usr/share/keyrings/jenkins-keyring.asc > /dev/null

    - name: Add Jenkins repository (correct URL)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: |
          deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian binary/

    - name: Update apt cache after adding Jenkins repo
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Ensure Jenkins service is enabled and running
      service:
        name: jenkins
        state: started
        enabled: yes

    - name: Get public IP address
      shell: curl -s ifconfig.me
      register: public_ip

    - name: Print Jenkins public IP
      debug:
        msg: "✅ Jenkins is installed and running at: http://{{ public_ip.stdout }}:8080"