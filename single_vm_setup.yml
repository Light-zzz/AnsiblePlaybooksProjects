---
- name: Update Ubuntu slave VM, install Nginx, and deploy a simple HTML page
  hosts: slaveVM
  become: yes
  tasks:

    - name: Update APT package index
      apt:
        update_cache: yes

    - name: Upgrade all installed packages
      apt:
        upgrade: dist
        autoremove: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx service is enabled and running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy a simple HTML page
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Welcome to Ubuntu Slave VM</title>
              <style>
                  body {
                      font-family: Arial, sans-serif;
                      background-color: #e9f5ff;
                      color: #333;
                      text-align: center;
                      margin-top: 10%;
                  }
                  h1 {
                      color: #007bff;
                  }
              </style>
          </head>
          <body>
              <h1>Welcome to the Ubuntu Slave VM!</h1>
              <p>This page was deployed automatically using Ansible by dipesh</p>
          </body>
          </html>

    - name: Restart Nginx to apply changes
      service:
        name: nginx
        state: restarted