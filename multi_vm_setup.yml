---
- name: Configure slaveVM1 - Install Nginx and deploy HTML page
  hosts: slaveVM1
  become: yes
  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy simple HTML page
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Welcome to slaveVM1</title>
          </head>
          <body style="text-align:center;">
              <h1>Welcome to slaveVM1</h1>
              <p>This page is served by Nginx and deployed using Ansible by dipesh</p>
          </body>
          </html>

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted

# -------------------------------------------------------------------------------------------------

- name: Configure slaveVM2 - Install Apache (httpd) and deploy HTML page
  hosts: slaveVM2
  become: yes
  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install Apache
      apt:
        name: apache2
        state: present

    - name: Ensure Apache is running and enabled
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Deploy simple HTML page
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Welcome to slaveVM2</title>
          </head>
          <body style="text-align:center;">
              <h1>Welcome to slaveVM2</h1>
              <p>This page is served by Apache (httpd) and deployed using Ansible by dipesh</p>
          </body>
          </html>

    - name: Restart Apache
      service:
        name: apache2
        state: restarted

